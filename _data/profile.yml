short_bio_text_justify: false
short_bio: >-
  <p>
    I am a first-year master's student jointly trained by the
    <a href="https://www.siat.ac.cn/" target="_blank">Shenzhen Institute of Advanced Technology (SIAT), Chinese Academy of Sciences</a>
    and <a href="https://www.sustech.edu.cn/" target="_blank">Southern University of Science and Technology (SUSTech)</a>,
    affiliated with the National Key Laboratory of Medical Imaging Science and Technology.
    I received my B.Eng. in Intelligent Medical Engineering from
    <a href="https://www.sztu.edu.cn/" target="_blank">Shenzhen Technology University</a> in 2025.
  </p>
  <p>
    My research focuses on <b>medical image analysis</b> and <b>quantitative MRI</b>.
    I work on deep-learning-based segmentation (Mamba / UNet architectures, e.g. TMa-UNet for hippocampus and
    cerebral artery segmentation), multi-echo water-fat separation and joint T1 / PDFF / B0 / R2* quantification
    (IR-Look-Locker, CSE, QPBO initialization), and bioimpedance spectroscopy for body composition estimation.
    I am broadly interested in combining signal processing, physical modeling and machine learning to solve
    clinical imaging problems.
  </p>

